name: Knowledge filter source preflight
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build source-only evaluator
        run: dotnet build src/Inventhor.KnowledgeFilter/Inventhor.KnowledgeFilter.csproj -c Release --nologo
      - name: Assert evidence diversity and fail-closed boundaries
        run: dotnet run --project tests/Inventhor.KnowledgeFilter.SelfTest/Inventhor.KnowledgeFilter.SelfTest.csproj -c Release --nologo
